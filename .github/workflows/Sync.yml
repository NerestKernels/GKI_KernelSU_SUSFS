name: Sync from GKI_KernelSU

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.PAT_TROP }}
          fetch-depth: 0

      - name: Copy tree and wipe Dusfff2 history
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          THIS_FILE="$(echo '${{ github.workflow_ref }}' | sed -E 's|.*/\.github/workflows/([^@]+)@.*|\1|')"
          mkdir -p /tmp/keep
          if [ -n "${THIS_FILE}" ] && [ -f ".github/workflows/${THIS_FILE}" ]; then
            cp ".github/workflows/${THIS_FILE}" "/tmp/keep/${THIS_FILE}"
          fi

          SRC="/tmp/gki-upstream"
          rm -rf "$SRC"
          git clone --depth=1 --branch Dusfff2 https://github.com/TheFloresto/GKI_KernelSU_SUSFS.git "$SRC"

          rsync -a --delete --exclude '.git/' "$SRC"/ ./
          rm -rf "$SRC"

          if [ -n "${THIS_FILE}" ] && [ -f "/tmp/keep/${THIS_FILE}" ]; then
            mkdir -p .github/workflows
            cp "/tmp/keep/${THIS_FILE}" ".github/workflows/${THIS_FILE}"
          fi

          git checkout --orphan sync-tmp
          git add -A
          git commit --allow-empty -m "Sync from TheFloresto/GKI_KernelSU_SUSFS (main)"

          git branch -M main
          git push --force origin main
