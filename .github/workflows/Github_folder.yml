name: Download .github folder
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download .github from NerestKernels/GKI_KernelSU @ dev
        run: |
          git clone --depth=1 --branch dev \
            https://github.com/NerestKernels/GKI_KernelSU.git \
            source_repo

          mkdir -p github_downloaded
          cp -r source_repo/.github/. github_downloaded/
          ls -la github_downloaded/

      - name: Upload .github as artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-folder
          path: github_downloaded/
          compression-level: 9
